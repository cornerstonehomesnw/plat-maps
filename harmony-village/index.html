<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harmony Village Homesite Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&family=Libre+Franklin:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Theme — light only, to sit on the white website page
------------------------------------------------------------------- */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --ink:#252a24; --ink-soft:#5d655b; --line:#dfe3dc;
  --pine:#557A4A; --pine-ink:#3f5c37; --focus:#2f6fd6;
  --navy:#1A303B; --btn:#639150; --ground:#D2D4D5; --lawn:#6F9C5C;
  --serif:Bitter,Georgia,"Times New Roman",serif;
  --sans:Quicksand,"Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{background:#ffffff}
body{margin:0;color:var(--navy);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* layout matches Sherwood Forest: title, map with the homesite card beside it, plan key, then directions + status key */
.wrap{max-width:1160px;margin:0 auto}
.title{font:400 32px/1.3 var(--serif);color:var(--navy);text-align:center;margin:12px 0 14px}
/* the card sits in its own column and is never cut off: if it is taller than the map, the stage grows and the map stays centered */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 336px;align-items:center;background:#fff}
.map{line-height:0;aspect-ratio:7967.75/3622}
#plat{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#plat text{font-family:Arial,Helvetica,sans-serif}

/* homesites: plan colors stay put; only the status dot changes */
#plat .house{stroke:#fff;stroke-width:7;transition:stroke-width .12s}
#plat .house.unlisted{stroke:#BDBFC1}
#plat .house.on{cursor:pointer}
#plat .house.on:hover,#plat .house.on.hover{stroke-width:18}
#plat .house:focus{outline:none}
#plat .house.on:focus-visible{stroke:var(--focus);stroke-width:18}
#plat .label{font:italic 400 71.34px Arial,Helvetica,sans-serif;fill:#fff;stroke:#fff;stroke-width:3;pointer-events:none}
#plat .label.unlisted{fill:#858789;stroke:#858789}
#plat .label.tbd{fill:#9a9da1;stroke:#9a9da1}
#plat .dot{stroke:#fff;stroke-width:7}
#plat .dot.unlisted{stroke:#BDBFC1}
#plat .dot.on{cursor:pointer}
/* selected homesite: the same green outline as the other community maps */
#plat .outline-out{fill:none;stroke:var(--pine);stroke-width:30;stroke-linejoin:round;pointer-events:none}
#plat .outline-in{display:none}

/* ------------------------------------------------------------------
   Homesite card — sits in the column beside the map
------------------------------------------------------------------- */
.side{position:relative;align-self:start;margin:14px 14px 14px 0;min-width:0;
  background:#fff;border-radius:6px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.side .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--btn);margin:0 0 4px}
.side .intro{margin:0 0 10px;line-height:1.45;font-size:15px}
.side .hint{color:var(--ink-soft);margin:0;font-size:15px}
.side h2{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:400;margin:0 0 4px;color:var(--navy)}
.side .price{font-style:italic;font-size:17px;margin:0 0 8px;color:var(--navy)}
.badge{font-weight:700;display:inline-flex;align-items:center;gap:7px;font-size:14px;margin-bottom:4px}
.pin{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.12);flex:none}
.side dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:1px 16px;font-size:15px;line-height:1.35}
.side dt{color:var(--ink-soft)}
.side dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.side dd small{display:block;font-weight:700;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft)}
.btn{position:relative;display:inline-block;border:1px solid var(--btn);color:var(--btn);background:transparent;
  font:400 16px/24px var(--sans);text-transform:uppercase;text-decoration:none;padding:6px 56px 6px 12px;transition:background .15s,color .15s}
.btn .arrow{position:absolute;top:0;right:0;bottom:0;width:40px;border-left:1px solid currentColor}
.btn .arrow::after{content:"";position:absolute;left:13px;top:50%;width:9px;height:9px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:translateY(-50%) rotate(45deg)}
.btn:hover{background:var(--btn);color:#fff}
.side .btn{display:block}
/* homesite renderings and the welcome photo share one 16:9 frame and fill it edge to edge (trimmed slightly as needed), so every card's picture is the same size */
.rendering{margin:-18px -18px 12px;aspect-ratio:16/9;overflow:hidden;background:var(--line)}
.rendering img{width:100%;height:100%;object-fit:cover;display:block}
.rendering:not(.empty) span{display:none}
.rendering.empty{display:flex;align-items:flex-end;position:relative;background:var(--plan)}
.rendering.empty::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.45))}
.rendering.empty span{position:relative;color:#fff;font-weight:700;font-size:15px;padding:10px 14px}
/* when the card is taller than the map, the white stage fills above and below the map */
.side.is-empty h2{font-size:22px;margin-bottom:6px}
.side .close{font-family:var(--sans);position:absolute;top:8px;right:8px;z-index:2;background:rgba(255,255,255,.94);border:0;border-radius:6px;padding:4px 10px;color:#252a24;font-size:14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* plan key (only plans shown on the map) */
/* two rows of equal columns (set by script), so chips line up; the script shrinks the type if a design line wouldn't fit on one line.
   Sizes are in em of the key's font size so everything scales together. */
.plans{--cols:5;list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px 20px;font:11px Arial,Helvetica,sans-serif}
.plans[hidden]{display:none}
.plans li{display:flex;align-items:center;gap:9px;min-width:0}
.plans .chip{width:4em;height:4em;flex:none}
.plans b{display:block;font-weight:700;font-size:1.55em;line-height:1.15}
.plans small{display:block;font-weight:700;font-size:1em;letter-spacing:.02em;text-transform:uppercase;line-height:1.35;white-space:nowrap}
.foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px 40px;margin:18px 0 4px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px 32px}
.legend li{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--navy)}
.legend .swatch{width:32px;height:32px;border-radius:50%;flex:none}

/* desktop: everything fits inside the embed's height, no scrollbar */
@media (min-width:1000px){
  html,body{overflow:hidden}
}

/* tablets, phones and narrow frames: title, map, plan key, status key, card, then directions.
   Nothing scrolls: the page is as tall as its content and the card shows in full. */
@media (max-width:999px){
  html,body{height:auto;overflow:hidden}
  .wrap{display:flex;flex-direction:column}
  .stage{display:contents}
  .title{order:0;font-size:24px;margin:6px 0 10px}
  .map{order:1;background:var(--ground)}
  .plans{order:2;margin:12px 12px 0;gap:8px 14px;font-size:10px}
  .plans .chip{width:2.6em;height:2.6em}
  .plans b{font-size:1.4em}
  .foot{display:contents}
  .legend{order:3;margin:12px 12px 0;flex-wrap:nowrap;justify-content:space-between;gap:0 6px}
  .legend li{font-size:min(14px, 2.8vw);gap:5px;white-space:nowrap}
  .legend .swatch{width:min(16px, 3.2vw);height:min(16px, 3.2vw)}
  .side{order:4;position:relative;inset:auto;width:auto;margin:12px 12px 0;padding:16px;box-shadow:none;border:1px solid var(--line);overflow:visible}
  .rendering{margin:-16px -16px 12px}
  #directions{order:5;align-self:flex-start;margin:12px 12px 2px;font-size:14px;padding:4px 50px 4px 10px}
  #directions .arrow{width:36px}
}
@media (max-width:560px){
  /* phones: too narrow for two rows, so the key wraps into as many rows as it needs */
  .plans{grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:8px 14px;font-size:9.5px}
  .plans .chip{width:1.9em;height:1.9em}
  .plans b{font-size:1.26em}
  /* the plan is wide: on phones the map scrolls sideways inside its frame */
  .map{aspect-ratio:auto;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  #plat{width:880px;max-width:none;height:auto}
  .legend{flex-wrap:wrap;justify-content:flex-start;gap:6px 16px}
}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  {name:"The Grove",      design:"Design A - Interior Unit", base:"#6D9A7A",                   text:"#6D9A7A"},
  {name:"The Ember",      design:"Design A - End Unit",      base:"#7D1B05", stripe:"#DB5C40", text:"#7D1B05"},
  {name:"The Ruby",       design:"Design A - Interior Unit", base:"#7D1B05",                   text:"#6C332C"},
  {name:"The Jade",       design:"Design A - Interior Unit", base:"#90A827",                   text:"#90A827"},
  {name:"The Atlanta",    design:"Design A - Interior Unit", base:"#2B7288",                   text:"#2B7288"},
  {name:"The Horizon",    design:"Design A - End Unit",      base:"#985B37", stripe:"#AB721D", text:"#985B37"},
  {name:"The Horizon",    design:"Design B - End Unit",      base:"#BF9568", stripe:"#985B36", text:"#985B37"},
  {name:"The Horizon",    design:"Design C - End Unit",      base:"#53433A", stripe:"#BA9166", text:"#985B37"},
  {name:"The Terra",      design:"",                         base:"#776037",                   text:"#776037"},
  {name:"The Emerald",    design:"",                         base:"#1D5C4D",                   text:"#1D5C4D"},
  {name:"TBD",            base:"#FEFEFE", tbd:true},
];
const STATUSES = [
  {name:"Move-in ready", label:"Move-in Ready", hex:"#6E9C5C"},
  {name:"Available",     label:"Available",     hex:"#3D6983"},
  {name:"Coming soon",   label:"Coming Soon",   hex:"#7C7C7C"},
  {name:"Model home",    label:"Model Home",    hex:"#333333"},
  {name:"Sold",          label:"Sold",          hex:"#993400", sold:true},   // red circle; the homesite keeps its plan colors
];
const UNRELEASED = "#4C4B4D";   // homesites not listed yet

/* ==================================================================
   Map logic — no edits needed below this line
================================================================== */
const svg = document.getElementById('plat');
const NS = 'http://www.w3.org/2000/svg';
const norm = s => (s||'').trim().toLowerCase();
const squash = s => norm(s).replace(/[^a-z]/g, '');
const statusOf = s => STATUSES.find(x => squash(x.name) === squash(s)) || STATUSES.find(x => x.sold); // misspelled = Sold, as on the other maps
// "Design B - End Unit", "B End", "design b" ... -> {letter:'b', unit:'end'}
const designKey = s => { const t = norm(s); const m = t.match(/design\s*([a-z])\b/) || t.match(/^([a-z])\b/);
  return {letter: m ? m[1] : '', unit: /\bend\b/.test(t) ? 'end' : /\bint/.test(t) ? 'int' : ''}; };
function planKey(r){
  const n = norm(r && r.plan);
  const named = PLANS.filter(x => !x.tbd && (norm(x.name) === n || norm(x.name) === 'the ' + n));
  if (!named.length) return PLANS.find(x => x.tbd);
  const want = designKey(r.design);
  const score = x => { const d = designKey(x.design); return (want.letter && d.letter === want.letter ? 2 : 0) + (want.unit && d.unit === want.unit ? 1 : 0); };
  return named.slice().sort((a, b) => score(b) - score(a))[0];
}
const planLabel = r => (!r.plan || /^tbd$/i.test(r.plan.trim())) ? 'To be determined' : r.plan.trim();
const designLabel = (r, plan) => (r.design || '').trim() || (plan.tbd ? '' : plan.design || '');
let data = LOTS.map(r => ({...r}));
let selected = null;

// hatch patterns for the end units
const defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS(NS, 'defs'), svg.firstChild);
PLANS.forEach((p, i) => {
  p.fill = p.base;
  if (!p.stripe) return;
  const pat = document.createElementNS(NS, 'pattern');
  pat.id = 'hatch' + i;
  pat.setAttribute('patternUnits', 'userSpaceOnUse');
  pat.setAttribute('width', '44'); pat.setAttribute('height', '44');
  pat.setAttribute('patternTransform', 'rotate(-45)');
  pat.innerHTML = `<rect width="44" height="44" fill="${p.base}"/><rect width="11" height="44" fill="${p.stripe}"/>`;
  defs.appendChild(pat);
  p.fill = `url(#hatch${i})`;
});
const chipFill = p => p.stripe ? `repeating-linear-gradient(45deg, ${p.base} 0 8px, ${p.stripe} 8px 10.5px)` : p.base;

// selection outline (drawn under the labels and dots)
const outlineG = svg.querySelector('#lot-outline');
const outOut = document.createElementNS(NS, 'polygon'); outOut.setAttribute('class', 'outline-out');
const outIn  = document.createElementNS(NS, 'polygon'); outIn.setAttribute('class', 'outline-in');
outlineG.append(outOut, outIn);

const els = lot => svg.querySelectorAll(`[data-lot="${CSS.escape(lot)}"]`);
const house = lot => svg.querySelector(`.house[data-lot="${CSS.escape(lot)}"]`);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// "TRUE", "Yes", "x", a ticked checkbox, etc. all count as listed
function isListed(v){ return v === true || /^(true|yes|y|x|1|listed|✓|✔)$/i.test(String(v ?? '').trim()); }
// listed and still for sale: clickable, opens the card
function onMarket(r){ return !!r && isListed(r.listed) && !statusOf(r.status).sold; }

function render(){
  const byLot = Object.fromEntries(data.map(r => [r.lot, r]));
  svg.querySelectorAll('.house').forEach(h => {
    const lot = h.dataset.lot, r = byLot[lot];
    const st = statusOf(r && r.status), plan = planKey(r);
    const colored = !!r && !plan.tbd, live = onMarket(r);
    els(lot).forEach(el => {
      el.classList.toggle('unlisted', !colored);
      el.classList.toggle('on', live);
      if (el.classList.contains('house')) el.style.fill = colored ? plan.fill : UNRELEASED;
      if (el.classList.contains('dot')) el.style.fill = st.hex;
    });
    if (live){
      h.setAttribute('tabindex', '0'); h.setAttribute('role', 'button');
      h.setAttribute('aria-label', `Homesite ${lot}, ${planLabel(r)} ${designLabel(r, plan)}, ${st.label}`);
    } else { h.removeAttribute('tabindex'); h.removeAttribute('role'); h.removeAttribute('aria-label'); }
  });
  drawSide(); drawPlanKey();
}

// plan key: plans with at least one listed, unsold homesite, plus the model home's plan
const inKey = r => onMarket(r) || (!!r && statusOf(r.status).name === 'Model home');
function drawPlanKey(){
  const used = new Set(data.filter(inKey).map(r => planKey(r)).filter(p => !p.tbd));
  const list = PLANS.filter(p => used.has(p));
  const ul = document.getElementById('plans');
  ul.hidden = !list.length;
  ul.dataset.count = list.length;
  ul.innerHTML = list.map(p => `<li><span class="chip" style="background:${chipFill(p)}"></span><span><b style="color:${p.text}">${esc(p.name)}</b>${p.design ? `<small style="color:${p.text}">${esc(p.design)}</small>` : ''}</span></li>`).join('');
}

// status key
document.getElementById('legend').innerHTML = STATUSES.map(s =>
  `<li><span class="swatch" style="background:${s.hex}"></span>${s.label}</li>`).join('');
const dir = document.getElementById('directions');
const setDirections = () => { dir.hidden = !DIRECTIONS_URL; if (DIRECTIONS_URL) dir.href = DIRECTIONS_URL; };
setDirections();

function drawSide(){
  const side = document.getElementById('side');
  const r = selected && data.find(x => x.lot === selected);
  if (!r || !onMarket(r)){
    selected = null;
    side.className = 'side is-empty';
    const hero = INTRO.image
      ? `<figure class="rendering" style="--plan:linear-gradient(135deg,#6F9C5C,#3f5c37)"><img src="${esc(INTRO.image)}" alt="Harmony Village" onerror="this.parentNode.classList.add('empty');this.remove()"><span>Harmony Village</span></figure>`
      : `<figure class="rendering empty" style="--plan:linear-gradient(135deg,#6F9C5C,#3f5c37)"><span>Harmony Village</span></figure>`;
    side.innerHTML = `${hero}<p class="eyebrow">${esc(INTRO.eyebrow)}</p><h2>${esc(INTRO.title)}</h2><p class="intro">${esc(INTRO.text)}</p><p class="hint">${esc(INTRO.hint)}</p>`;
    outOut.setAttribute('points', ''); outIn.setAttribute('points', '');
    return;
  }
  const st = statusOf(r.status), plan = planKey(r), design = designLabel(r, plan);
  const pts = house(r.lot).getAttribute('points');
  outOut.setAttribute('points', pts); outIn.setAttribute('points', pts);
  side.className = 'side';
  side.innerHTML = `
    <button class="close" aria-label="Close homesite details">Close</button>
    ${renderImg(r, plan)}
    <div class="badge"><span class="pin" style="background:${st.hex}"></span>${st.label}</div>
    <h2>Homesite ${esc(r.lot)}</h2>
    <p class="price">${r.price ? esc(money(r.price)) : 'Contact us for pricing'}</p>
    <dl>
      <dt>Plan</dt><dd>${esc(planLabel(r))}${design ? ' ' + esc(design.replace(/^design\s+/i, '')) : ''}</dd>
      <dt>SQFT</dt><dd>${show(r.sqft, v => withCommas(v))}</dd>
      <dt>Beds</dt><dd>${show(r.beds)}</dd>
      <dt>Baths</dt><dd>${show(r.baths)}</dd>
    </dl>
    ${r.link ? `<a class="btn" href="${esc(r.link)}" target="_top">Explore This Home<span class="arrow"></span></a>` : ''}`;
  side.querySelector('.close').onclick = () => { selected = null; render(); };
  if (matchMedia('(max-width:999px)').matches) side.scrollIntoView({block:'nearest', behavior:'smooth'});
}

// value formatting: "489900" -> "$489,900", "1850" -> "1,850"; blanks show a dash
const isNum = v => /^\$?[\d,]+(\.\d+)?$/.test(String(v).trim());
const withCommas = v => isNum(v) ? Number(String(v).replace(/[$,]/g,'')).toLocaleString('en-US') : v;
const money = v => isNum(v) ? '$' + withCommas(v) : v;
const show = (v, f = x => x) => (v ?? '') === '' ? '<span style="color:var(--ink-soft);font-weight:400">—</span>' : esc(f(v));

function renderImg(r, plan){
  const src = r.image || plan.image;
  const fill = plan.stripe ? `repeating-linear-gradient(-45deg, ${plan.base} 0 10px, ${plan.stripe} 10px 13px)` : plan.base;
  if (src) return `<figure class="rendering" style="--plan:${fill}"><img src="${esc(src)}" alt="Rendering of ${esc(planLabel(r))} on homesite ${esc(r.lot)}" onerror="this.parentNode.classList.add('empty');this.insertAdjacentHTML('afterend','<span>Rendering coming soon</span>');this.remove()"></figure>`;
  return `<figure class="rendering empty" style="--plan:${fill}"><span>Rendering coming soon</span></figure>`;
}

// interaction: the house, its circle or its number all open the homesite
function pick(lot){
  const r = data.find(x => x.lot === lot);
  if (!onMarket(r)) return;
  selected = selected === lot ? null : lot; render();
}
svg.addEventListener('click', e => { const t = e.target.closest('.house,.dot'); if (t) pick(t.dataset.lot); });
svg.addEventListener('keydown', e => {
  const t = e.target.closest('.house'); if (!t) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(t.dataset.lot); }
});
svg.addEventListener('pointerover', e => { const t = e.target.closest('.dot'); if (t) house(t.dataset.lot)?.classList.add('hover'); });
svg.addEventListener('pointerout',  e => { const t = e.target.closest('.dot'); if (t) house(t.dataset.lot)?.classList.remove('hover'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected) { selected = null; render(); } });

// live data from the HV sheet tab
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"' && text[i+1] === '"'){ cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ','){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
// sheet headers are matched loosely: "Lot Page Link" -> link, "Elevation" -> design, etc.
const HEADER_KEYS = {lot:'lot', homesite:'lot', status:'status', plan:'plan', design:'design', elevation:'design', price:'price', sqft:'sqft', squarefeet:'sqft',
  beds:'beds', baths:'baths', link:'link', lotpage:'link', lotpagelink:'link', homesitelink:'link', rendering:'image', image:'image',
  listed:'listed', listedonwebsite:'listed', list:'listed', onwebsite:'listed'};
const withUnit = (sheet, built) => { const s = designKey(sheet), b = designKey(built);
  return s.letter && !s.unit && b.unit && b.letter === s.letter ? built : sheet; };
function applySheet(csvText){
  const grid = parseCSV(csvText);
  const head = (grid.shift() || []).map(h => HEADER_KEYS[squash(h)]);
  const rows = grid.filter(r => r.some(c => c.trim())).map(cells => {
    const r = {}; head.forEach((k, i) => { if (k) r[k] = (cells[i] || '').trim(); }); return r;
  });
  // labeled rows anywhere in the tab: the value is the next filled cell after the label
  const labeled = re => { for (const cells of grid) { const i = cells.findIndex(c => re.test(c.trim())); if (i >= 0) { const v = cells.slice(i + 1).find(c => c.trim()); if (v) return v.trim(); } } return ''; };
  const hero = rows.find(r => /^(hero|hero image|hero photo|community photo|welcome photo)$/i.test((r.lot || '').trim()));
  if (hero && hero.image) INTRO.image = hero.image;
  const text = labeled(/^(plat description|description|welcome text|intro)\b/i); if (text) INTRO.text = text;
  const link = labeled(/^directions( link)?\b/i); if (link) { DIRECTIONS_URL = link; setDirections(); }
  const byLot = Object.fromEntries(rows.filter(r => r.lot).map(r => [r.lot.toUpperCase(), r]));
  data = LOTS.map(r => {
    const s = byLot[r.lot.toUpperCase()];
    if (!s) return r;
    // the sheet is the source of truth; a blank status keeps the built-in one so a homesite never vanishes by accident.
    // The tab's Design dropdown only says "Design A"; whether it's an end or interior unit comes from the drawing.
    return {...r, ...s, status: s.status || r.status, design: withUnit(s.design ?? r.design, r.design)};
  });
  render(); lockStage();
}
async function loadSheet(){
  if (!SHEET_CSV_URL) return;
  try{
    const res = await fetch(SHEET_CSV_URL, {cache:'no-store'});
    if (!res.ok) throw new Error(res.status);
    applySheet(await res.text());
  } catch(err){ console.warn('Homesite sheet could not be loaded; showing built-in data.', err); }
}

// plan key: two rows on tablets and desktops, shrinking the type only as much as the longest design line needs
const keyEl = document.getElementById('plans');
function fitKey(){
  keyEl.style.fontSize = ''; keyEl.style.gridTemplateColumns = '';
  if (matchMedia('(max-width:560px)').matches || keyEl.hidden) return;
  keyEl.style.setProperty('--cols', Math.max(1, Math.ceil((+keyEl.dataset.count || 0) / 2)));
  let size = parseFloat(getComputedStyle(keyEl).fontSize);
  const tooWide = () => [...keyEl.children].some(li => li.scrollWidth > li.clientWidth + 0.5);
  while (tooWide() && size > 8) { size -= 0.25; keyEl.style.fontSize = size + 'px'; }
  // still too tight for two rows (a narrow frame): let the key wrap instead of shrinking further
  if (tooWide()) { keyEl.style.fontSize = ''; keyEl.style.gridTemplateColumns = 'repeat(auto-fill,minmax(170px,1fr))'; }
}
new MutationObserver(fitKey).observe(keyEl, {childList: true});
addEventListener('resize', fitKey);
document.fonts && document.fonts.ready.then(fitKey);
// desktop: hold the map still. The stage is sized once for the tallest card (welcome or any homesite),
// so switching cards never changes its height or moves the map.
function lockStage(){
  const st = document.querySelector('.stage'), side = document.getElementById('side');
  st.style.minHeight = '';
  if (matchMedia('(max-width:999px)').matches) return;
  const keep = selected; let h = 0;
  for (const lot of [null, ...data.filter(onMarket).map(r => r.lot)]) { selected = lot; drawSide(); h = Math.max(h, side.offsetHeight); }
  selected = keep; drawSide();
  const m = getComputedStyle(side);
  st.style.minHeight = Math.ceil(h + parseFloat(m.marginTop) + parseFloat(m.marginBottom)) + 'px';
}
addEventListener('resize', lockStage);
document.fonts && document.fonts.ready.then(lockStage);
render(); lockStage(); loadSheet();
// phones: the map scrolls sideways — start it centered on the homesites
const mapEl = document.querySelector('.map');
if (mapEl.scrollWidth > mapEl.clientWidth) mapEl.scrollLeft = (mapEl.scrollWidth - mapEl.clientWidth) * 0.6;

// when embedded in an iframe, tell the host page how tall the map is
const wrapEl = document.querySelector('.wrap');
const postHeight = () => { try { parent.postMessage({lotMapHeight: Math.ceil(wrapEl.getBoundingClientRect().height)}, '*'); } catch(e){} };
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(wrapEl);
addEventListener('load', postHeight);
})();
</script>
</body>
</html>
